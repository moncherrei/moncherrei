<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#cfeefa">
<meta name="description" content="Walk around a little floating island and step through the doors of Breine's web projects: Arterie and Charm & Carry.">
<title>Breine's Web Projects ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;700&family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--ink:#46535d;--muted:#5f6e77;--blue:#69b5d4;--blue-d:#3b82a6;--pink:#e99fbd;--pink-d:#c4678f;--card:rgba(255,255,255,.88);--line:rgba(255,255,255,.95);--focus:#3b82a6;--pc:#69b5d4;--pb:#3b82a6}
body.dark{--ink:#f6edf4;--muted:#c0c7d0;--card:rgba(43,48,64,.9);--line:rgba(255,255,255,.14);--focus:#f0acc8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Quicksand',sans-serif;color:var(--ink);background:linear-gradient(180deg,#3a9be0 0%,#7cc8f1 34%,#c9e8f8 66%,#fff3d2 100%)}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#060818 0%,#141a45 38%,#3d2a6b 72%,#8a4a7d 100%);opacity:0;transition:opacity 1s}
body.dark .sky{opacity:1}
#stage{position:fixed;inset:0}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(255,238,196,.3),transparent 42%),radial-gradient(ellipse at 50% 55%,transparent 60%,rgba(40,60,90,.12) 100%)}
body.dark #stage::after{background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(5,8,30,.28) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(70,110,130,.16)}
.hud-tl{position:fixed;top:14px;left:14px;width:max-content;max-width:min(360px,calc(100% - 190px));padding:12px 14px 14px;z-index:5;transition:padding .28s ease,background .28s ease,box-shadow .28s ease}
.hud-head{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hud-tl h1{font:400 clamp(1.55rem,4.2vw,2.2rem)/1.1 'Lobster',cursive;color:var(--blue-d)}
.hud-collapse{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;background:rgba(255,255,255,.48);color:var(--ink);font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .25s,background .25s}
.hud-collapse:hover{transform:scale(1.08);background:rgba(255,255,255,.8)}
.hud-body{overflow:hidden;max-height:220px;opacity:1;transition:max-height .32s ease,opacity .2s ease,margin .32s ease}
.hud-tl.is-collapsed{padding:7px 9px;border-radius:999px}
.hud-tl.is-collapsed .hud-head{gap:8px}
.hud-tl.is-collapsed h1{font-size:1rem;white-space:nowrap}
.hud-tl.is-collapsed .hud-collapse{transform:rotate(180deg)}
.hud-tl.is-collapsed .hud-body{max-height:0;opacity:0;margin:0;pointer-events:none}
.hud-tl.is-collapsed .hud-body *{pointer-events:none}
body.dark .hud-tl h1{color:#9bdcf1}
.hud-tl p{margin:5px 0 10px;font-size:.88rem;line-height:1.45;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:7px}
.pill{display:inline-flex;align-items:center;min-height:36px;padding:6px 13px;border-radius:99px;color:#fff;text-decoration:none;font-weight:700;font-size:.84rem;background:var(--b)}
.pill:hover{filter:brightness(1.08)}
.hud-tr{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:5}
.ubtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;min-width:44px;justify-content:center;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
.ubtn:hover{transform:translateY(-2px)}
.hint,.prompt{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;transition:opacity .3s,transform .3s}
.hint{padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;color:var(--muted);text-align:center;width:max-content;max-width:92vw}
.prompt{opacity:0;pointer-events:none;transform:translate(-50%,16px)}
.prompt button{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 28px;border:0;border-radius:99px;background:var(--pb);color:#fff;font:500 1.2rem 'Fredoka',sans-serif;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.prompt kbd{font:700 .75rem 'Quicksand';padding:2px 8px;border-radius:7px;background:rgba(255,255,255,.28)}
body.near .prompt{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
body.near .hint{opacity:0;pointer-events:none}
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#e6f9ff,#fff0f7,#fff8dc);color:#4d93b5;transition:opacity .7s,visibility .7s}
.loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader .heart{font-size:3.4rem;display:block;animation:beat .8s ease-in-out infinite}
.loader h2{font:400 clamp(2.4rem,9vw,3.6rem)/1.1 'Lobster',cursive;margin:8px 0 4px}
.loader p{font-weight:700;margin-bottom:20px}
.loader button{min-height:50px;padding:12px 30px;border:0;border-radius:99px;background:#e99fbd;color:#fff;font:500 1.15rem 'Fredoka';cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.loader.ready button{opacity:1;pointer-events:auto}
.loader.ready .heart{animation-duration:1.6s}
@keyframes beat{50%{transform:scale(1.14)}}
.portal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--pc);clip-path:circle(0 at 50% 62%);visibility:hidden;transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s .9s}
.portal.open{clip-path:circle(150% at 50% 62%);visibility:visible;transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.pbar strong{font:400 1.5rem 'Lobster',cursive;color:#fff;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .ubtn{background:#fff;color:#46535d;text-decoration:none;font-size:.9rem;padding:8px 14px}
#frame{flex:1;width:100%;border:0;background:#fff}
.no3d .hud-tr,.no3d .hint,.no3d .prompt{display:none}
.no3d .hud-tl{top:50%;left:50%;transform:translate(-50%,-50%);max-width:92vw;text-align:center}
.no3d .quick{justify-content:center}
@media(max-width:760px){.hud-tr .ubtn span:last-child{display:none}.hud-tr .ubtn{padding:8px}.hud-tr{flex-direction:column}.hud-tl{max-width:calc(100% - 84px)}.hud-tl.is-collapsed{max-width:calc(100% - 84px)}.hud-tl.is-collapsed h1{font-size:.95rem}.hint{font-size:.8rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
[hidden]{display:none!important}
.joy{display:none;position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid var(--line);backdrop-filter:blur(6px);touch-action:none;z-index:6}
.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:var(--card);box-shadow:0 5px 14px rgba(0,0,0,.2)}
@media(pointer:coarse){.joy{display:block}.hint,.prompt{bottom:calc(158px + env(safe-area-inset-bottom))}}
.no3d .joy{display:none}
.note{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(40,36,80,.38);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.note.open{opacity:1;visibility:visible}
.scroll{width:min(440px,100%);max-height:88vh;overflow:auto;padding:26px 26px 22px;background:#fff8e8;color:#5b4a42;border:3px solid #e9c99a;border-radius:26px;transform:scale(.9) rotate(-1.5deg);transition:transform .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
.note.open .scroll{transform:none}
body.dark .scroll{background:#2f2a42;color:#f6edf4;border-color:#6d5a8a}
.scroll h2{font:400 2.1rem/1.15 'Lobster',cursive;color:#7a5cc0;margin-bottom:10px}
body.dark .scroll h2{color:#c9b6f0}
.scroll p{line-height:1.65;margin-bottom:10px;font-size:.98rem}
.scroll ul{list-style:none;margin:14px 0;padding:12px 14px;border-radius:16px;background:rgba(122,92,192,.12);text-align:left}
.scroll li{padding:3px 0;font-weight:700}
.scroll li.done{color:#3f8f5f}
body.dark .scroll li.done{color:#8fdcae}
.scroll .foot{font-size:.88rem;opacity:.8;margin-bottom:16px}
.scroll .ubtn{background:#7a5cc0;color:#fff;border:0;margin:auto}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div id="stage" aria-hidden="true"></div>

<div class="loader" id="loader" role="status">
  <div>
    <span class="heart" aria-hidden="true">♡</span>
    <h2>Breine's little world</h2>
    <p id="ltext">Sprinkling a little magic...</p>
    <button id="go" type="button">Step inside ♡</button>
  </div>
</div>

<header class="hud-tl card" id="projectHud">
  <div class="hud-head">
    <h1 id="hudTitle">My Web Projects</h1>
    <button class="hud-collapse" id="hudToggle" type="button" aria-expanded="true" aria-controls="hudBody" aria-label="Collapse project panel">⌃</button>
  </div>
  <div class="hud-body" id="hudBody">
    <p>Two little worlds on one floating island. Walk up to a door to go inside.</p>
    <nav class="quick" aria-label="Projects">
      <a class="pill" style="--b:#3b82a6" data-site="arterie" href="arterie/" target="_blank" rel="noopener">Arterie</a>
      <a class="pill" style="--b:#c4678f" data-site="charm" href="marketplace/" target="_blank" rel="noopener">Charm &amp; Carry</a>
      <a class="pill" id="notePill" hidden style="--b:#7a5cc0" data-site="note" href="#">Story spot</a>
    </nav>
  </div>
</header>

<div class="hud-tr">
  <button class="ubtn" id="ovBtn" type="button" aria-pressed="false" aria-label="View the whole island"><span aria-hidden="true">🌍</span><span id="ovl">Whole island</span></button>
  <button class="ubtn" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to night"><span aria-hidden="true" id="ti">🌙</span><span id="tl">Night</span></button>
  <button class="ubtn" id="musicBtn" type="button" aria-pressed="false" aria-label="Turn on gentle melody"><span aria-hidden="true">♫</span><span id="ml">Music off</span></button>
</div>

<div class="hint card" id="hint">WASD or arrows to walk · drag to look around · scroll to zoom</div>
<div class="prompt" id="prompt" aria-live="polite"><button id="enterBtn" type="button"><span id="etxt">Enter</span><kbd>E</kbd></button></div>

<div class="joy" id="joy" aria-hidden="true"><div class="knob" id="knob"></div></div>
<div class="note" id="note" role="dialog" aria-labelledby="ntitle" aria-hidden="true">
  <div class="scroll"><h2 id="ntitle"></h2><div id="nbody"></div><ul id="nquest"></ul><p class="foot" id="nfoot"></p><button class="ubtn" id="nclose" type="button">Got it ♡</button></div>
</div>
<div class="portal" id="portal" role="dialog" aria-label="Project viewer" aria-hidden="true">
  <div class="pbar">
    <button class="ubtn" id="back" type="button"><span aria-hidden="true">←</span><span>Back to the island</span></button>
    <strong id="ptitle"></strong>
    <a class="ubtn" id="popen" target="_blank" rel="noopener"><span>Open in new tab</span><span aria-hidden="true">↗</span></a>
  </div>
  <iframe id="frame" title="Project"></iframe>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const body = document.body, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) $('hint').textContent = 'Joystick to walk · drag to look · pinch to zoom';

/* ---------- Retractable project label ---------- */
const projectHud = $('projectHud'), hudToggle = $('hudToggle');
hudToggle.addEventListener('click', () => {
  const collapsed = projectHud.classList.toggle('is-collapsed');
  hudToggle.setAttribute('aria-expanded', String(!collapsed));
  hudToggle.setAttribute('aria-label', collapsed ? 'Expand project panel' : 'Collapse project panel');
  hudToggle.textContent = collapsed ? '⌄' : '⌃';
});

/* ---------- Music (upbeat, synthesized kawaii chiptune; opt-in) ---------- */
let ac, mg, mt = null, ni = 0;
// A bright C-major / A-minor loop with a little syncopation.
const lead = [659.25,783.99,987.77,783.99,698.46,880,1046.5,880,659.25,783.99,880,1174.66,1046.5,880,783.99,698.46];
const bass = [130.81,196,164.81,246.94,110,164.81,146.83,220];
function voice(freq, duration=.18, wave='triangle', volume=.035, delay=0) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + delay, osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = wave; osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(.0001, t);
  gain.gain.exponentialRampToValueAtTime(volume, t + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
  osc.connect(gain); gain.connect(mg); osc.start(t); osc.stop(t + duration + .025);
}
function kick() {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime, osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(125, t); osc.frequency.exponentialRampToValueAtTime(48, t + .11);
  gain.gain.setValueAtTime(.0001, t); gain.gain.exponentialRampToValueAtTime(.11, t + .008); gain.gain.exponentialRampToValueAtTime(.0001, t + .13);
  osc.connect(gain); gain.connect(mg); osc.start(t); osc.stop(t + .14);
}
function musicTick() {
  const step = ni++ % 16;
  voice(lead[step], .19, step % 4 === 2 ? 'sine' : 'triangle', .042);
  // Sparkly off-beat answer notes make it feel more like a tiny game soundtrack.
  if (step % 2 === 1) voice(lead[(step + 3) % 16] * 2, .09, 'sine', .012, .075);
  if (step % 2 === 0) voice(bass[Math.floor(step / 2) % bass.length], .25, 'triangle', .048);
  if (step % 4 === 0) kick();
}
async function music(on) {
  if (on) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) { $('ml').textContent = 'No audio'; return; }
    if (!ac) { ac = new C(); mg = ac.createGain(); mg.gain.value = .52; mg.connect(ac.destination); }
    await ac.resume();
    if (mt !== null) clearInterval(mt);
    musicTick(); mt = setInterval(musicTick, 220);
  } else { if (mt !== null) clearInterval(mt); mt = null; }
  $('musicBtn').setAttribute('aria-pressed', on);
  $('musicBtn').setAttribute('aria-label', on ? 'Turn off upbeat music' : 'Turn on upbeat music');
  $('ml').textContent = on ? 'Music on' : 'Music off';
}
$('musicBtn').onclick = () => music(mt === null).catch(() => $('ml').textContent = 'Tap to retry');
document.addEventListener('visibilitychange', () => { if (document.hidden && mt !== null) music(false); });

/* ---------- WebGL check (falls back to plain links) ---------- */
let R;
try { if (!window.THREE) throw 0; R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { body.classList.add('no3d'); $('loader').classList.add('hidden'); return; }

$('notePill').hidden = false;
const T = THREE, scene = new T.Scene(), cam = new T.PerspectiveCamera(48, 1, .1, 250);
R.setPixelRatio(Math.min(devicePixelRatio, 2));
$('stage').appendChild(R.domElement);
const hq = !touch;
const amb = new T.HemisphereLight(0xe6f2ff, 0x9bb870, .62), sun = new T.DirectionalLight(0xffe9c4, .55);
sun.position.set(-14, 20, 12); scene.add(amb, sun);
R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
sun.castShadow = true; sun.shadow.mapSize.set(hq ? 2048 : 1024, hq ? 2048 : 1024);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 60 }); sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
scene.fog = new T.FogExp2(0xe6f1ee, .009);
const M = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 1, metalness: 0 }, o));
function nTex(rep, lo, o = {}) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), r = Math.random; x.fillStyle = '#fff'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 70; i++) {
    const px = r() * 256, py = r() * 256, rad = 20 + r() * 40, v = lo + r() * (255 - lo) | 0;
    for (const dx of [-256, 0, 256]) for (const dy of [-256, 0, 256]) { const g = x.createRadialGradient(px + dx, py + dy, 0, px + dx, py + dy, rad); g.addColorStop(0, `rgba(${v},${v},${v},.35)`); g.addColorStop(1, `rgba(${v},${v},${v},0)`); x.fillStyle = g; x.fillRect(px + dx - rad, py + dy - rad, rad * 2, rad * 2); }
  }
  if (o.rows) { x.fillStyle = 'rgba(120,90,90,.12)'; for (let y = 0; y < 256; y += 32) x.fillRect(0, y, 256, 3); }
  if (o.blocks) { x.fillStyle = 'rgba(90,80,80,.14)'; for (let y = 0; y < 256; y += 64) { x.fillRect(0, y, 256, 3); for (let b = (y / 64 % 2) * 64; b < 256; b += 128) x.fillRect(b, y, 3, 64); } }
  if (o.streak) { x.fillStyle = 'rgba(80,50,30,.1)'; for (let i = 0; i < 40; i++) x.fillRect(r() * 256, 0, 2, 256); }
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4; return t;
}
const groundTex = nTex(5, 205), stoneTex = nTex(2, 190, { blocks: 1 }), wallTex = nTex(2, 215), roofTex = nTex(3, 200, { rows: 1 }), woodTex = nTex(1, 170, { streak: 1 }), leafTex = nTex(2, 160);
const add = (g, m, x = 0, y = 0, z = 0, p = scene) => { const o = new T.Mesh(g, m); o.position.set(x, y, z); p.add(o); return o; };
const V = (x, y, z) => new T.Vector3(x, y, z);
const glowTex = (a, b) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, a); g.addColorStop(.35, b); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new T.CanvasTexture(c); };

/* ---------- Island ---------- */
add(new T.CylinderGeometry(14, 14, .3, 48), M(0x7fc28f, { map: groundTex }), 0, -.15, 0);
add(new T.CylinderGeometry(14, 14.4, .75, 48), M(0x8d6e56, { map: stoneTex }), 0, -.675, 0);
for (let i = 0; i < 16; i++) { const a = i * 2.4, d = 2 + (i * 5.3) % 10; add(new T.CircleGeometry(1.4 + (i % 4) * .5, 20), M(i % 2 ? 0x74b985 : 0x8ecf9b), Math.cos(a) * d, .012 + i * .0004, Math.sin(a) * d).rotation.x = -Math.PI / 2; }
const rg = new T.ConeGeometry(14.4, 11, 40, 10), rp = rg.attributes.position;
for (let i = 0; i < rp.count; i++) { const x = rp.getX(i), y = rp.getY(i), z = rp.getZ(i), n = Math.sin(x * 1.1 + z * .7) * Math.cos(y * .9 + x * .4) * Math.sin(z * 1.3 - y * .8), k = 1 + n * .13; rp.setXYZ(i, x * k, y + n * .6, z * k); }
rg.computeVertexNormals();
const rock = add(rg, M(0xb7a9b8, { map: stoneTex }), 0, -6.8, 0); rock.rotation.x = Math.PI;
add(new T.CylinderGeometry(2.3, 2.3, .06, 32), M(0xe0b88c), 0, .03, 0);
add(new T.TorusGeometry(2.3, .07, 6, 40), M(0xc99a6e), 0, .06, 0).rotation.x = Math.PI / 2;
const rnd = (() => { let s = 7; return () => (s = s * 16807 % 2147483647) / 2147483647; })();

/* ---------- Houses ---------- */
const glowMat = new T.MeshBasicMaterial({ color: 0xdff4fb });
const houses = [], hits = [];
function house(key, name, x, z, wall, roof, trim, kind, labelCol) {
  const g = new T.Group(); g.position.set(x, 0, z); g.rotation.y = Math.atan2(-x, -z); g.userData.key = key; scene.add(g); g.updateMatrix();
  add(new T.BoxGeometry(4.4, 3, 3.6), M(wall, { map: wallTex }), 0, 1.5, 0, g);
  add(new T.BoxGeometry(4.65, .4, 3.85), M(0xb4a79c, { map: stoneTex }), 0, .2, 0, g);
  add(new T.BoxGeometry(.55, 1.4, .55), M(0xb87a6c, { map: stoneTex }), 1.3, 4.3, -.5, g);
  const r = add(new T.ConeGeometry(3.6, 2.2, 4), M(roof, { map: roofTex }), 0, 4.1, 0, g); r.rotation.y = Math.PI / 4;
  add(new T.BoxGeometry(1.2, 2, .2), M(trim), 0, 1, 1.82, g);

/* ---------- Enter / leave a site ---------- */
const sites = {
  arterie: { url: 'arterie/', pc: '#69b5d4', pb: '#3b82a6' },
  charm: { url: 'marketplace/', pc: '#e99fbd', pb: '#c4678f' },
  note: { pb: '#7a5cc0' }
};

  target = null; autoEnter = null; h.g.updateMatrixWorld();
  ent = { h, t: 0, from: cam.position.clone(), lf: look.clone(), to: V(0, 1.5, 2.9).applyMatrix4(h.g.matrix), lt: V(0, 1.1, 1.9).applyMatrix4(h.g.matrix) };
  body.style.setProperty('--pc', s.pc); body.style.setProperty('--pb', s.pb); body.classList.remove('near');

  ent = null; setTimeout(() => { if (!ent) $('frame').src = 'about:blank'; }, 950); document.activeElement.blur();

$('back').onclick = leave;

/* ---------- Theme ---------- */
$('themeBtn').onclick = () => {
  const d = body.classList.toggle('dark'); goal = d ? 1 : 0;
  $('themeBtn').setAttribute('aria-pressed', d); $('themeBtn').setAttribute('aria-label', d ? 'Switch to day' : 'Switch to night');
  $('ti').textContent = d ? '☀️' : '🌙'; $('tl').textContent = d ? 'Day' : 'Night';
  document.querySelector('meta[name=theme-color]').content = d ? '#202431' : '#cfeefa';
};
const cA = [new T.Color(0xe6f2ff), new T.Color(0x7f8fd8)], cF = [new T.Color(0xe6f1ee), new T.Color(0x2a2450)], cH = [new T.Color(0x9bb870), new T.Color(0x55785a)], cS = [new T.Color(0xfff2dd), new T.Color(0x9fb4ff)], cG = [new T.Color(0xdff4fb), new T.Color(0xffd27a)], cK = [new T.Color(0xffffff), new T.Color(0x8a86b8)];

scene.traverse(o => { if (!o.isMesh || !o.material.isMeshStandardMaterial) return; o.receiveShadow = true; if (!o.isInstancedMesh && !o.material.transparent) { o.geometry.computeBoundingBox(); const b = o.geometry.boundingBox; o.castShadow = (b.max.y - b.min.y) * o.scale.y > .3; } });
/* ---------- Loop ---------- */
const far = { d: 66, p: .7 }, ease = t => t * t * (3 - 2 * t), cen = V(), want = V(), wc = new T.Color();

addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
function frame(now) {

  const dt = Math.min(.05, (now - last) / 1000); last = now; if (paused) return; t += dt;
  let wx = 0, wz = 0, spd = 1, moving = false;
  if (started && !ent && !noteOpen) {
    let mx = jx, mz = jz;
    if (keys.w || keys.arrowup) mz--; if (keys.s || keys.arrowdown) mz++; if (keys.a || keys.arrowleft) mx--; if (keys.d || keys.arrowright) mx++;
    const l = Math.hypot(mx, mz);
    if (l > .08) { spd = Math.min(1, l); if (l > 1) { mx /= l; mz /= l; } wx = mx * Math.cos(yaw) + mz * Math.sin(yaw); wz = -mx * Math.sin(yaw) + mz * Math.cos(yaw); }
    else if (target) { const dx = target.x - P.x, dz = target.z - P.z, d = Math.hypot(dx, dz); if (d < .2) { target = null; if (autoEnter) enter(autoEnter); } else { wx = dx / d; wz = dz / d; } }
    moving = !!(wx || wz); P.x += wx * 5.4 * spd * dt; P.z += wz * 5.4 * spd * dt;
    for (const c of cols) { const dx = P.x - c.x, dz = P.z - c.z, d = Math.hypot(dx, dz), m = c.r + .45; if (d < m) { P.x = c.x + dx / d * m; P.z = c.z + dz / d * m; } }
    const rr = Math.hypot(P.x, P.z); if (rr > 12.6) { P.x *= 12.6 / rr; P.z *= 12.6 / rr; }
    if (moving) { let da = Math.atan2(wx, wz) - face; da = Math.atan2(Math.sin(da), Math.cos(da)); face += da * Math.min(1, dt * 12); }

    if (near !== lastNear) { lastNear = near; body.classList.toggle('near', !!near); if (near) { body.style.setProperty('--pb', sites[near].pb); $('etxt').textContent = near === 'note' ? 'Read the note' : 'Enter ' + spots.find(q => q.key === near).name; } }
  }

  hb.scale.set(1, 1 + (moving ? 0 : Math.sin(t * 2) * .025), 1);
  ears.forEach((e, i) => e.rotation.x = moving ? -.35 : Math.sin(t * 1.5 + i) * .05);
  if (started && intro < 1) intro = Math.min(1, intro + dt / 3.4);
  ov += ((overview ? 1 : 0) - ov) * Math.min(1, dt * 3); if (ov > .01) yaw += dt * .12 * ov;
  if (ent) {

    cam.position.lerpVectors(ent.from, ent.to, e); look.lerpVectors(ent.lf, ent.lt, e);
  } else {
    const e = ease(intro), zm = innerWidth / innerHeight < .8 ? 1.35 : 1;
    const dd = (far.d + (dist * zm - far.d) * e) * (1 - ov) + 42 * ov, pp = (far.p + (pitch - far.p) * e) * (1 - ov) + .8 * ov;
    cen.set(P.x * (1 - ov), 1, P.z * (1 - ov));

  cam.lookAt(look); sky.position.copy(cam.position);
  if (!reduce) {
    clouds.forEach(c => { c.position.x += c.userData.s * dt; if (c.position.x > 55) c.position.x = -55; });
    bubbles.forEach(b => b.position.y += Math.sin(t * .7 + b.userData.p) * .006);
    rocks.forEach((r, i) => { r.position.y = r.userData.y + Math.sin(t * .8 + i * 2) * .5; r.rotation.y += dt * .3; });
  }
  ring.rotation.z += dt * .8; if (!reduce) windU.value = t;

  amb.color.copy(cA[0]).lerp(cA[1], night); amb.groundColor.copy(cH[0]).lerp(cH[1], night); amb.intensity = .62 - .27 * night; scene.fog.color.copy(cF[0]).lerp(cF[1], night); lampLights.forEach(l => l.intensity = night * 1.4);
  sun.color.copy(cS[0]).lerp(cS[1], night); sun.intensity = .55 - .3 * night;
  glowMat.color.copy(cG[0]).lerp(cG[1], night); cm.color.copy(cK[0]).lerp(cK[1], night);
  sunS.material.opacity = dk; rbM.forEach(m => m.opacity = .55 * dk); moon.material.opacity = night;
  layers.forEach((l, i) => l.material.opacity = night * (i === 3 ? .85 : .65 + .35 * Math.sin(t * (1.4 + i * .7) + i * 2)));
  lampGlow.opacity = night; poolM.opacity = night * .5; ffM.opacity = night; bookGlow.material.opacity = .4 + .15 * Math.sin(t * 2) + night * .3;
  shNext -= dt;
  if (night > .6 && shNext < 0 && shT < 0) { shT = 0; shNext = 5 + rnd() * 7; shoot.position.set(-60 + rnd() * 80, 55 + rnd() * 30, -90); }
  if (shT >= 0) { shT += dt; shoot.position.x += dt * 70; shoot.position.y -= dt * 22; shoot.material.opacity = Math.sin(Math.min(1, shT / .9) * Math.PI) * night; if (shT > .9) { shT = -1; shoot.material.opacity = 0; } }
  const fp = ffG.attributes.position;
  ffB.forEach((b, i) => fp.setXYZ(i, b[0] + Math.sin(t * .6 + b[3]) * .6, b[1] + Math.sin(t * 1.1 + b[3] * 2) * .3, b[2] + Math.cos(t * .5 + b[3]) * .6)); fp.needsUpdate = true;
  bf.forEach(g => { const u = g.userData, a = t * .5 + u.p; g.visible = night < .5; g.position.set(u.c.x + Math.cos(a) * 2.2, u.c.y + Math.sin(t * 2 + u.p) * .25, u.c.z + Math.sin(a * 1.3) * 2.2); g.rotation.y = -a; u.w.forEach((q, k) => q.rotation.z = (k ? 1 : -1) * (.3 + Math.abs(Math.sin(t * 12 + u.p)) * .8)); });

}
requestAnimationFrame(frame);

/* ---------- Start ---------- */
const ready = () => { $('loader').classList.add('ready'); $('ltext').textContent = 'Everything is ready.'; $('go').focus(); };
Promise.race([document.fonts.load('64px Lobster'), new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => {
  const lab = (txt, col, parent, y, w) => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
    x.font = '64px Lobster, cursive'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round'; x.lineWidth = 14; x.strokeStyle = 'rgba(255,255,255,.95)';
    x.strokeText(txt, 256, 68); x.fillStyle = col; x.fillText(txt, 256, 68);
    const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c), transparent: true })); s.scale.set(w, w / 4, 1); s.position.set(0, y, 0); parent.add(s);
  };
  const board = (txt, dir, y, col) => {
    const g = new T.Group();
    [1, -1].forEach(side => {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d'), d = dir * side;
      x.fillStyle = '#ecc99a'; x.strokeStyle = '#a97a4e'; x.lineWidth = 8; x.beginPath();
      if (d === 0) x.rect(8, 14, 496, 100); else if (d < 0) { x.moveTo(8, 64); x.lineTo(60, 14); x.lineTo(496, 14); x.lineTo(496, 114); x.lineTo(60, 114); } else { x.moveTo(504, 64); x.lineTo(452, 14); x.lineTo(16, 14); x.lineTo(16, 114); x.lineTo(452, 114); }
